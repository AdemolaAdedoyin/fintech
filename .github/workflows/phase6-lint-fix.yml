name: Phase 6 lint fix

on:
  push:
    branches:
      - modernization/phase-6-queues-outbox
    paths:
      - '.github/workflows/phase6-lint-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Apply type-safe lint fixes
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('src/async/async-runtime.service.ts')
          text = runtime.read_text()
          text = text.replace(
              "  async ping(): Promise<string> {\n    const client = await this.domainQueue.client;\n    return client.ping();\n  }",
              "  async ping(): Promise<string> {\n    await this.domainQueue.getJobCounts();\n    return 'PONG';\n  }",
          )
          text = text.replace(
              "    const value = payload as Prisma.JsonObject;",
              "    const value = payload;",
          )
          runtime.write_text(text)

          test = Path('test/async-outbox.e2e-spec.ts')
          text = test.read_text()
          marker = "interface NotificationBody {\n  id: string;\n  eventType: OutboxEventType;\n  readAt: string | null;\n}\n"
          replacement = marker + "\ninterface WebhookEndpointBody {\n  id: string;\n  enabled: boolean;\n  signingSecret?: string;\n}\n"
          text = text.replace(marker, replacement)
          text = text.replace(
              "    expect(createResponse.body.signingSecret).toEqual(expect.any(String));\n    const endpointId = createResponse.body.id as string;",
              "    const createdEndpoint = createResponse.body as WebhookEndpointBody;\n    expect(createdEndpoint.signingSecret).toEqual(expect.any(String));\n    const endpointId = createdEndpoint.id;",
          )
          text = text.replace(
              "    expect(listResponse.body).toEqual(\n      expect.arrayContaining([expect.objectContaining({ id: endpointId, enabled: true })]),\n    );\n    expect(listResponse.body[0]).not.toHaveProperty('signingSecret');",
              "    const listedEndpoints = listResponse.body as WebhookEndpointBody[];\n    expect(listedEndpoints).toEqual(\n      expect.arrayContaining([expect.objectContaining({ id: endpointId, enabled: true })]),\n    );\n    expect(listedEndpoints[0]).not.toHaveProperty('signingSecret');",
          )
          text = text.replace(
              "        expect(response.body.enabled).toBe(false);",
              "        expect((response.body as WebhookEndpointBody).enabled).toBe(false);",
          )
          test.write_text(text)

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Format and lint
        run: |
          npm run format
          npm run lint

      - name: Commit fixes
        run: |
          if git diff --quiet -- src/async/async-runtime.service.ts test/async-outbox.e2e-spec.ts; then
            echo 'No lint-fix changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/async/async-runtime.service.ts test/async-outbox.e2e-spec.ts
          git commit -m 'fix: satisfy phase 6 type-safe lint rules'
          git push origin HEAD:modernization/phase-6-queues-outbox
