name: CI

on:
  push:
    branches:
      - main
      - 'modernization/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://fintech:fintech_test@localhost:5432/fintech_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_test
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Quality gates
        run: npm run ci

      - name: Smoke test PostgreSQL readiness endpoint
        shell: bash
        run: |
          test -f dist/main.js
          node dist/main.js > /tmp/fintech-api.log 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID"
            fi
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo 'Application exited before readiness check succeeded.'
              cat /tmp/fintech-api.log
              exit 1
            fi

            sleep 1
          done

          echo 'Readiness endpoint did not become healthy in time.'
          cat /tmp/fintech-api.log
          exit 1
