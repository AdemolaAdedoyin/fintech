name: CI

on:
  push:
    branches:
      - main
      - 'modernization/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase6-review-fix:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/modernization/phase-6-queues-outbox' &&
      github.event.head_commit.message == 'ci: trigger phase 6 review fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Apply reviewed runtime changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/async/async-runtime.service.ts')
          text = path.read_text()
          text = text.replace(
              "import { WebhookSigningService } from './webhook-signing.service';",
              "import { WebhookSigningService } from './webhook-signing.service';\nimport { WebhookTargetService } from './webhook-target.service';",
              1,
          )
          text = text.replace(
              "    private readonly signing: WebhookSigningService,\n  ) {",
              "    private readonly signing: WebhookSigningService,\n    private readonly targets: WebhookTargetService,\n  ) {",
              1,
          )

          marker = '  private async publishOutboxEvent(event: OutboxEvent): Promise<void> {'
          before, rest = text.split(marker, 1)
          rest = rest.replace(
              "removeOnFail: { age: 604_800, count: 10_000 },",
              "removeOnFail: true,",
              1,
          )
          rest = rest.replace("          publishedAt: new Date(),\n", "", 1)
          rest = rest.replace(
              "          publishAttempts: { increment: 1 },\n          lastError: null,",
              "          publishAttempts: { increment: 1 },\n          nextPublishAt: new Date(Date.now() + 60_000),\n          lastError: null,",
              1,
          )
          text = before + marker + rest

          text = text.replace(
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }

    const payload = this.parseDomainPayload(event.payload);""",
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }
    if (event.publishedAt) return;

    const payload = this.parseDomainPayload(event.payload);""",
              1,
          )

          transaction_end = """      }
    });
  }

  private async processWebhookDelivery"""
          transaction_replacement = """      }

      await transaction.outboxEvent.updateMany({
        where: { id: event.id, publishedAt: null },
        data: { publishedAt: new Date(), lastError: null },
      });
    });
  }

  private async processWebhookDelivery"""
          if transaction_end not in text:
              raise SystemExit('Could not locate domain event transaction end')
          text = text.replace(transaction_end, transaction_replacement, 1)

          start = text.index("    try {\n      const response = await fetch", text.index('private async processWebhookDelivery'))
          end = text.index("    } catch (error) {", start)
          replacement = """    try {
      const responseStatus = await this.targets.post({
        url: delivery.endpoint.url,
        headers: {
          'content-type': 'application/json',
          'user-agent': 'fintech-transaction-platform/1.0',
          'x-fintech-event': delivery.outboxEvent.eventType,
          'x-fintech-delivery': delivery.id,
          'x-fintech-timestamp': timestamp,
          'x-fintech-signature': signature,
        },
        body: rawBody,
        timeoutMs,
      });

      if (responseStatus < 200 || responseStatus >= 300) {
        const message = `Webhook endpoint returned HTTP ${responseStatus}`;
        await this.recordWebhookFailure(delivery.id, message, finalAttempt, responseStatus);
        throw new Error(message);
      }

      await this.prisma.webhookDelivery.update({
        where: { id: delivery.id },
        data: {
          status: WebhookDeliveryStatus.SUCCEEDED,
          attemptCount: { increment: 1 },
          lastAttemptAt: new Date(),
          responseStatus,
          lastError: null,
          deliveredAt: new Date(),
        },
      });
"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          e2e = Path('test/async-outbox.e2e-spec.ts')
          text = e2e.read_text()
          needle = """    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );

    const replayResponse"""
          replacement = """    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );
    const processedOutbox = await prisma.outboxEvent.findUniqueOrThrow({ where: { id: outbox.id } });
    expect(processedOutbox.publishedAt).not.toBeNull();

    const replayResponse"""
          if needle not in text:
              raise SystemExit('Could not locate async outbox E2E assertion block')
          e2e.write_text(text.replace(needle, replacement, 1))

          spec = Path('src/async/webhook-target.service.spec.ts')
          spec.write_text(spec.read_text().replace("203.0.113.10", "8.8.8.8"))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund
      - run: npm run format && npm run lint && npm run typecheck && npm test -- --runInBand

      - name: Commit reviewed fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git commit -m 'fix: harden outbox recovery and webhook delivery'
          git push origin HEAD:modernization/phase-6-queues-outbox

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://fintech:fintech_test@localhost:5432/fintech_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      JWT_ACCESS_TTL_SECONDS: 900
      WEBHOOK_SIGNING_MASTER_SECRET: ci-only-webhook-signing-master-secret-that-is-long-enough
      WEBHOOK_REQUEST_TIMEOUT_MS: 1000
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fintech_test
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech -d fintech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Quality gates
        run: npm run ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Domain e2e tests
        run: npm run test:e2e

      - name: Validate container definitions
        run: |
          docker compose config --quiet
          docker build --target migrate --tag fintech-migrate:ci .
          docker build --tag fintech-transaction-platform:ci .

      - name: Smoke test database and async health endpoints
        shell: bash
        run: |
          test -f dist/main.js
          node dist/main.js > /tmp/fintech-api.log 2>&1 &
          APP_PID=$!

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID"
            fi
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready > /tmp/health.json \
              && curl --fail --silent http://localhost:3000/api/v1/health/async > /tmp/async-health.json; then
              cat /tmp/health.json
              cat /tmp/async-health.json
              exit 0
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo 'Application exited before readiness checks succeeded.'
              cat /tmp/fintech-api.log
              exit 1
            fi

            sleep 1
          done

          echo 'Readiness endpoints did not become healthy in time.'
          cat /tmp/fintech-api.log
          exit 1
