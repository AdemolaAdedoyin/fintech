name: Phase 6 webhook target formatter

on:
  push:
    branches:
      - modernization/phase-6-queues-outbox
    paths:
      - '.github/workflows/phase6-prettier.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Format target service
        run: npx prettier --write src/async/webhook-target.service.ts

      - name: Commit formatted file
        run: |
          if git diff --quiet -- src/async/webhook-target.service.ts; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/async/webhook-target.service.ts
          git commit -m 'style: apply prettier to webhook target service'
          git push origin HEAD:modernization/phase-6-queues-outbox
