name: Phase 6 review fixes

on:
  push:
    branches:
      - modernization/phase-6-queues-outbox
    paths:
      - '.github/workflows/phase6-review-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Apply review fixes
        shell: python {0}
        run: |
          from pathlib import Path

          runtime = Path('src/async/async-runtime.service.ts')
          text = runtime.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected runtime block not found:\n{old[:240]}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { WebhookSigningService } from './webhook-signing.service';",
              "import { WebhookSigningService } from './webhook-signing.service';\nimport { WebhookTargetService } from './webhook-target.service';",
          )
          replace_once(
              "    private readonly prisma: PrismaService,\n    private readonly signing: WebhookSigningService,\n  ) {",
              "    private readonly prisma: PrismaService,\n    private readonly signing: WebhookSigningService,\n    private readonly targets: WebhookTargetService,\n  ) {",
          )
          replace_once(
              """      await this.domainQueue.add(
        event.eventType,
        { outboxEventId: event.id },
        {
          jobId: event.id,
          attempts: 5,
          backoff: { type: 'exponential', delay: 1_000 },
          removeOnComplete: { age: 86_400, count: 10_000 },
          removeOnFail: { age: 604_800, count: 10_000 },
        },
      );

      await this.prisma.outboxEvent.update({
        where: { id: event.id },
        data: {
          publishedAt: new Date(),
          publishAttempts: { increment: 1 },
          lastError: null,
        },
      });""",
              """      await this.domainQueue.add(
        event.eventType,
        { outboxEventId: event.id },
        {
          jobId: event.id,
          attempts: 5,
          backoff: { type: 'exponential', delay: 1_000 },
          removeOnComplete: { age: 86_400, count: 10_000 },
          removeOnFail: true,
        },
      );

      await this.prisma.outboxEvent.update({
        where: { id: event.id },
        data: {
          publishAttempts: { increment: 1 },
          nextPublishAt: new Date(Date.now() + 60_000),
          lastError: null,
        },
      });""",
          )
          replace_once(
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }

    const payload = this.parseDomainPayload(event.payload);""",
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }
    if (event.publishedAt) return;

    const payload = this.parseDomainPayload(event.payload);""",
          )
          replace_once(
              """      if (endpoints.length > 0) {
        await transaction.webhookDelivery.createMany({
          data: endpoints.map((endpoint) => ({
            endpointId: endpoint.id,
            outboxEventId: event.id,
          })),
          skipDuplicates: true,
        });
      }
    });""",
              """      if (endpoints.length > 0) {
        await transaction.webhookDelivery.createMany({
          data: endpoints.map((endpoint) => ({
            endpointId: endpoint.id,
            outboxEventId: event.id,
          })),
          skipDuplicates: true,
        });
      }

      await transaction.outboxEvent.updateMany({
        where: { id: event.id, publishedAt: null },
        data: { publishedAt: new Date(), lastError: null },
      });
    });""",
          )
          replace_once(
              """      const response = await fetch(delivery.endpoint.url, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'user-agent': 'fintech-transaction-platform/1.0',
          'x-fintech-event': delivery.outboxEvent.eventType,
          'x-fintech-delivery': delivery.id,
          'x-fintech-timestamp': timestamp,
          'x-fintech-signature': signature,
        },
        body: rawBody,
        redirect: 'error',
        signal: AbortSignal.timeout(timeoutMs),
      });

      if (!response.ok) {
        const message = `Webhook endpoint returned HTTP ${response.status}`;
        await this.recordWebhookFailure(delivery.id, message, finalAttempt, response.status);
        throw new Error(message);
      }

      await this.prisma.webhookDelivery.update({
        where: { id: delivery.id },
        data: {
          status: WebhookDeliveryStatus.SUCCEEDED,
          attemptCount: { increment: 1 },
          lastAttemptAt: new Date(),
          responseStatus: response.status,
          lastError: null,
          deliveredAt: new Date(),
        },
      });""",
              """      const responseStatus = await this.targets.post({
        url: delivery.endpoint.url,
        headers: {
          'content-type': 'application/json',
          'user-agent': 'fintech-transaction-platform/1.0',
          'x-fintech-event': delivery.outboxEvent.eventType,
          'x-fintech-delivery': delivery.id,
          'x-fintech-timestamp': timestamp,
          'x-fintech-signature': signature,
        },
        body: rawBody,
        timeoutMs,
      });

      if (responseStatus < 200 || responseStatus >= 300) {
        const message = `Webhook endpoint returned HTTP ${responseStatus}`;
        await this.recordWebhookFailure(delivery.id, message, finalAttempt, responseStatus);
        throw new Error(message);
      }

      await this.prisma.webhookDelivery.update({
        where: { id: delivery.id },
        data: {
          status: WebhookDeliveryStatus.SUCCEEDED,
          attemptCount: { increment: 1 },
          lastAttemptAt: new Date(),
          responseStatus,
          lastError: null,
          deliveredAt: new Date(),
        },
      });""",
          )
          runtime.write_text(text)

          test = Path('test/async-outbox.e2e-spec.ts')
          text = test.read_text()
          old = """    const notifications = await waitForNotifications(outbox.id, 2);
    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );

    const replayResponse = await request(httpServer)"""
          new = """    const notifications = await waitForNotifications(outbox.id, 2);
    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );
    const processedOutbox = await prisma.outboxEvent.findUniqueOrThrow({ where: { id: outbox.id } });
    expect(processedOutbox.publishedAt).not.toBeNull();

    const replayResponse = await request(httpServer)"""
          if old not in text:
              raise SystemExit('Expected async E2E block not found')
          test.write_text(text.replace(old, new, 1))

          target_spec = Path('src/async/webhook-target.service.spec.ts')
          text = target_spec.read_text().replace(
              "{ address: '203.0.113.10', family: 4 },",
              "{ address: '8.8.8.8', family: 4 },",
          )
          target_spec.write_text(text)

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Validate review fixes
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm test -- --runInBand

      - name: Commit fixes
        run: |
          if git diff --quiet -- src test; then
            echo 'No review-fix changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git commit -m 'fix: harden outbox recovery and webhook delivery'
          git push origin HEAD:modernization/phase-6-queues-outbox
