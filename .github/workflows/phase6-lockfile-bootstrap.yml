name: Phase 6 lockfile bootstrap

on:
  push:
    branches:
      - modernization/phase-6-queues-outbox
    paths:
      - '.github/workflows/phase6-lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add BullMQ and refresh lockfile
        run: npm install bullmq@5 --save

      - name: Commit generated dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: add BullMQ dependency for phase 6'
          git push origin HEAD:modernization/phase-6-queues-outbox
