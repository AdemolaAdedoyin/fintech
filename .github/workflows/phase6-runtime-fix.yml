name: Phase 6 runtime review helper

on:
  push:
    branches:
      - modernization/phase-6-queues-outbox
    paths:
      - '.github/workflows/phase6-runtime-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernization/phase-6-queues-outbox

      - name: Patch reviewed runtime paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/async/async-runtime.service.ts')
          text = path.read_text()

          text = text.replace(
              "import { WebhookSigningService } from './webhook-signing.service';",
              "import { WebhookSigningService } from './webhook-signing.service';\nimport { WebhookTargetService } from './webhook-target.service';",
              1,
          )
          text = text.replace(
              "    private readonly signing: WebhookSigningService,\n  ) {",
              "    private readonly signing: WebhookSigningService,\n    private readonly targets: WebhookTargetService,\n  ) {",
              1,
          )

          marker = '  private async publishOutboxEvent(event: OutboxEvent): Promise<void> {'
          before, rest = text.split(marker, 1)
          rest = rest.replace(
              "removeOnFail: { age: 604_800, count: 10_000 },",
              "removeOnFail: true,",
              1,
          )
          rest = rest.replace("          publishedAt: new Date(),\n", "", 1)
          rest = rest.replace(
              "          publishAttempts: { increment: 1 },\n          lastError: null,",
              "          publishAttempts: { increment: 1 },\n          nextPublishAt: new Date(Date.now() + 60_000),\n          lastError: null,",
              1,
          )
          text = before + marker + rest

          text = text.replace(
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }

    const payload = this.parseDomainPayload(event.payload);""",
              """    if (!event) {
      throw new Error(`Outbox event ${outboxEventId} no longer exists`);
    }
    if (event.publishedAt) return;

    const payload = this.parseDomainPayload(event.payload);""",
              1,
          )

          transaction_end = """      }
    });
  }

  private async processWebhookDelivery"""
          transaction_replacement = """      }

      await transaction.outboxEvent.updateMany({
        where: { id: event.id, publishedAt: null },
        data: { publishedAt: new Date(), lastError: null },
      });
    });
  }

  private async processWebhookDelivery"""
          if transaction_end not in text:
              raise SystemExit('Could not locate domain event transaction end')
          text = text.replace(transaction_end, transaction_replacement, 1)

          start = text.index("    try {\n      const response = await fetch", text.index('private async processWebhookDelivery'))
          end = text.index("    } catch (error) {", start)
          replacement = """    try {
      const responseStatus = await this.targets.post({
        url: delivery.endpoint.url,
        headers: {
          'content-type': 'application/json',
          'user-agent': 'fintech-transaction-platform/1.0',
          'x-fintech-event': delivery.outboxEvent.eventType,
          'x-fintech-delivery': delivery.id,
          'x-fintech-timestamp': timestamp,
          'x-fintech-signature': signature,
        },
        body: rawBody,
        timeoutMs,
      });

      if (responseStatus < 200 || responseStatus >= 300) {
        const message = `Webhook endpoint returned HTTP ${responseStatus}`;
        await this.recordWebhookFailure(delivery.id, message, finalAttempt, responseStatus);
        throw new Error(message);
      }

      await this.prisma.webhookDelivery.update({
        where: { id: delivery.id },
        data: {
          status: WebhookDeliveryStatus.SUCCEEDED,
          attemptCount: { increment: 1 },
          lastAttemptAt: new Date(),
          responseStatus,
          lastError: null,
          deliveredAt: new Date(),
        },
      });
"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          e2e = Path('test/async-outbox.e2e-spec.ts')
          text = e2e.read_text()
          needle = """    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );

    const replayResponse"""
          replacement = """    expect(new Set(notifications.map((item) => item.userId))).toEqual(
      new Set([sender.user.id, recipient.user.id]),
    );
    const processedOutbox = await prisma.outboxEvent.findUniqueOrThrow({ where: { id: outbox.id } });
    expect(processedOutbox.publishedAt).not.toBeNull();

    const replayResponse"""
          if needle not in text:
              raise SystemExit('Could not locate async outbox E2E assertion block')
          e2e.write_text(text.replace(needle, replacement, 1))

          spec = Path('src/async/webhook-target.service.spec.ts')
          spec.write_text(spec.read_text().replace("203.0.113.10", "8.8.8.8"))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund

      - name: Validate
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm test -- --runInBand

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          if git diff --cached --quiet; then
            echo 'No runtime review changes to commit.'
            exit 0
          fi
          git commit -m 'fix: harden outbox recovery and webhook delivery'
          git push origin HEAD:modernization/phase-6-queues-outbox
